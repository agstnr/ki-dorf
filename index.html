<!doctype html>
<html lang="de-AT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Content-Security-Policy: nur Dateien aus diesem Ordner, keine Verbindung nach außen, kein Inline-Skript, kein eval.
     Auf GitHub Pages lassen sich keine eigenen HTTP-Köpfe setzen, darum steht die Regel hier. frame-ancestors wirkt in einem meta-Element nicht. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="description" content="KI-Dorf: Begleitspiel zum KI-Seminar. Läuft ohne Konto, ohne Tracking und ohne Internet.">
<title>KI-Dorf</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<a class="skip" href="#app">Zum Inhalt springen</a>
<header class="topbar">
  <a class="brand" href="#dorf"><span class="brandmark" aria-hidden="true"></span>KI-Dorf</a>
  <nav class="tabs" aria-label="Bereiche">
    <a href="#dorf" data-tab="dorf">Dorf</a>
    <a href="#bibliothek" data-tab="bibliothek">Bibliothek</a>
    <a href="#fortschritt" data-tab="fortschritt">Fortschritt</a>
  </nav>
  <div class="tools">
    <button type="button" class="toolbtn" id="btnHelp">Hilfe</button>
    <button type="button" class="toolbtn" id="btnPause" aria-pressed="false">Pause</button>
    <button type="button" class="toolbtn" id="btnMenu">Menü</button>
  </div>
</header>
<main id="app" class="wrap" tabindex="-1">
  <noscript><p>Das KI-Dorf braucht JavaScript. Es lädt nichts aus dem Internet nach.</p></noscript>
</main>
<p class="sr" id="live" role="status" aria-live="polite"></p>
<div class="toast" id="toast" hidden></div>
<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dlghead"><h2 id="dlgTitle" tabindex="-1"></h2><button type="button" class="toolbtn" id="dlgClose" aria-label="Schließen">✕</button></div>
  <div id="dlgBody"></div>
</dialog>
<footer class="foot wrap">
  <p><a href="#impressum">Impressum und Lizenzen</a></p>
</footer>
<script src="vendor/three.kd.js"></script>
<script src="daten/quellen.js"></script>
<script src="daten/haeuser1.js"></script>
<script src="daten/haeuser2.js"></script>
<script src="daten/prompts.js"></script>
<script src="js/kern.js"></script>
<script src="js/figuren.js"></script>
<script src="js/aufgaben.js"></script>
<script src="js/welt.js"></script>
<script src="js/app.js"></script>
</body>
</html>
